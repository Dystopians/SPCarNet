train:
  seed: 0
  epochs: 2
  batch_size: 2
  num_workers: 0
  lr: 0.001
  weight_decay: 0.0001
  amp: false
  log_interval: 1
  val_interval: 1
  save_interval: 1
  wandb_enable: true
  wandb_project: ss3dm_prior
  wandb_mode: offline
  max_visualization_examples: 2
  fixed_visualization_patch_ids: []
  step_visualization_interval_steps: 500
  step_visualization_num_examples: 1
  step_visualization_patch_ids: []
  debug_use_all_patches_for_train_val: false
  allow_split_fallback: false
  debug_val_fraction: 0.25
