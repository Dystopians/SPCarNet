dataset:
  subsets:
    - train
  seed: 0

corruptions:
  target_corrupted_count: 3072
  point_dropout:
    enabled: true
    dropout_ratio: 0.18
  gaussian_jitter:
    enabled: true
    sigma: 0.035
    anisotropic: true
  normal_noise:
    enabled: true
    sigma: 0.12
    flip_prob: 0.05
  local_hole_mask:
    enabled: true
    max_holes: 2
    hole_radius: 0.28
  outlier_cluster:
    enabled: true
    cluster_size: 40
    cluster_offset_sigma: 0.55
    cluster_spread_sigma: 0.035
  density_imbalance:
    enabled: true
    region_radius: 0.32
    thin_probability: 0.5
    thin_ratio: 0.55
    duplicate_count: 72

model:
  model_type: v10_cross_attention_hybrid
  latent_dim: 512
  retrieval_dim: 256
  recon_point_count: 3072
  use_observed_condition: true
  use_local_frame: true
  use_residual_reconstruction: true
  codebook_size: 512
  vq_commitment_cost: 0.25
  use_vector_quantization: true
  teacher_encoder_enabled: true
  occupancy_hidden_dim: 384
  num_latent_queries: 48
  num_cross_attention_layers: 4
  num_latent_self_attention_layers: 2
  attention_heads: 8
  ffn_dim: 1024
  dropout: 0.1
  token_hidden_dims: [256, 512]
  decoder_hidden_dims: [1024, 512]
  point_defect_hidden_dims: [512, 256]
  score_head_hidden_dims: [512, 256]
  intrinsic_head_hidden_dims: [512, 256]
  retrieval_head_hidden_dims: [512, 256]
  occupancy_hidden_dims: [384, 384, 384]

loss_weights:
  recon_chamfer_loss: 1.0
  recon_normal_loss: 0.3
  point_defect_loss: 0.3
  corruption_score_loss: 0.05
  intrinsic_difficulty_loss: 0.25
  intrinsic_difficulty_pairwise_weight: 0.5
  intrinsic_difficulty_pairwise_margin: 0.05
  occupancy_bce_loss: 0.25
  free_space_violation_loss: 0.25
  vq_commitment_loss: 0.05
  prototype_diversity_loss: 0.01
  latent_align_loss: 0.01
  retrieval_align_loss: 0.02
  hard_example_reweight: 0.6
  hard_weight_source: blend
  hard_weight_blend_alpha: 0.5
