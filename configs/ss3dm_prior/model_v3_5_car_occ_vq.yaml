dataset:
  subsets:
    - train
  seed: 0

corruptions:
  target_corrupted_count: 2048
  point_dropout:
    enabled: true
    dropout_ratio: 0.18
  gaussian_jitter:
    enabled: true
    sigma: 0.02
    anisotropic: true
  normal_noise:
    enabled: true
    sigma: 0.08
    flip_prob: 0.02
  local_hole_mask:
    enabled: true
    max_holes: 2
    hole_radius: 0.18
  outlier_cluster:
    enabled: true
    cluster_size: 32
    cluster_offset_sigma: 0.30
    cluster_spread_sigma: 0.02
  density_imbalance:
    enabled: true
    region_radius: 0.22
    thin_probability: 0.5
    thin_ratio: 0.50
    duplicate_count: 48

model:
  model_type: hybrid_v2
  latent_dim: 448
  retrieval_dim: 160
  recon_point_count: 2048
  use_observed_condition: true
  use_local_frame: true
  use_residual_reconstruction: true
  use_vector_quantization: true
  teacher_encoder_enabled: true
  codebook_size: 64
  occupancy_hidden_dim: 224

loss_weights:
  recon_chamfer_loss: 1.0
  recon_normal_loss: 0.1
  point_defect_loss: 0.3
  corruption_score_loss: 0.1
  intrinsic_difficulty_loss: 0.0
  intrinsic_difficulty_pairwise_weight: 0.0
  occupancy_bce_loss: 0.2
  free_space_violation_loss: 0.2
  vq_commitment_loss: 0.05
  prototype_diversity_loss: 0.01
  latent_align_loss: 0.01
  retrieval_align_loss: 0.01
