train:
  seed: 0
  epochs: 10
  batch_size: 8
  num_workers: 0
  lr: 0.0005
  min_lr: 0.00005
  lr_scheduler: cosine
  weight_decay: 0.0005
  grad_clip_norm: 1.0
  amp: false
  log_interval: 50
  val_interval: 1
  save_interval: 1
  wandb_enable: true
  wandb_project: ss3dm_prior
  wandb_mode: offline
  max_visualization_examples: 3
  fixed_visualization_patch_ids: []
  step_visualization_interval_steps: 500
  step_visualization_num_examples: 1
  step_visualization_patch_ids: []
  debug_use_all_patches_for_train_val: true
  allow_debug_split_override: true
  allow_split_fallback: true
  debug_val_fraction: 0.2
