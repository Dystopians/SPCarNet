# CarNet_v0.8 — point-space conditional flow matching (no residual decoder).
#
# Motivation: v0.7 diagnosis (docs/car_model/carnet_v0_8_diagnosis.md) showed
# the residual `recon = corrupted + delta` head collapses to a fixed ~0.04
# smoothing filter under chamfer supervision. The 0.04 is a lower bound
# regardless of corruption — only the gaussian_jitter profile produced a
# positive gain; 5 of 6 other single-corruption profiles had NEGATIVE gain.
#
# Changes vs v0.7:
#   - model_type              : v11_latent_flow_hybrid -> v12_point_flow_hybrid
#   - use_residual_reconstruction: forced to False by v12 constructor
#   - new point_flow_decoder (per-point conditional flow matching decoder)
#   - new point_flow_normal_head
#   - corruptions kept at v0.7 / v0.4 levels (holding difficulty constant so
#     the architectural swap is the only controlled variable)

dataset:
  subsets:
    - train
  seed: 0

corruptions:
  target_corrupted_count: 2048
  point_dropout: {enabled: true, dropout_ratio: 0.25}
  gaussian_jitter: {enabled: true, sigma: 0.06, anisotropic: true}
  normal_noise: {enabled: true, sigma: 0.08, flip_prob: 0.02}
  local_hole_mask: {enabled: true, max_holes: 3, hole_radius: 0.22}
  outlier_cluster: {enabled: true, cluster_size: 48, cluster_offset_sigma: 0.30, cluster_spread_sigma: 0.02}
  density_imbalance: {enabled: true, region_radius: 0.22, thin_probability: 0.5, thin_ratio: 0.50, duplicate_count: 48}

model:
  model_type: v12_point_flow_hybrid
  latent_dim: 384
  retrieval_dim: 192
  recon_point_count: 2048
  use_observed_condition: true
  use_local_frame: true
  # use_residual_reconstruction is forced to False by v12 constructor
  teacher_encoder_enabled: true
  occupancy_hidden_dim: 256
  use_vector_quantization: false
  num_latent_queries: 32
  num_cross_attention_layers: 3
  num_latent_self_attention_layers: 2
  attention_heads: 6
  ffn_dim: 768
  dropout: 0.10
  token_hidden_dims: [256, 384]
  decoder_hidden_dims: [768, 384]
  point_defect_hidden_dims: [384, 192]
  score_head_hidden_dims: [384, 192]
  intrinsic_head_hidden_dims: [384, 192]
  retrieval_head_hidden_dims: [384, 192]
  occupancy_hidden_dims: [256, 256, 256]
  latent_flow_hidden_dims: [768, 768]
  latent_flow_time_embed_dim: 96
  latent_flow_dropout: 0.05
  latent_flow_target: hidden_residual
  stochastic_eval_k_list: [1, 4, 8]
  stochastic_flow_steps: 8
  stochastic_free_space_safe_threshold: 0.10
  stochastic_rerank_weights:
    observed_consistency: 0.20
    visible_consistency: -0.35
    free_space_penalty: -0.30
    prototype_consistency: 0.15
  use_symmetry_head: true
  symmetry_head_hidden_dim: 192
  symmetry_head_dropout: 0.05
  use_retrieval_anchors: true
  num_retrieval_anchors: 3
  retrieval_anchor_dropout: 0.1
  # Point flow decoder (v0.8 specific)
  point_flow_hidden_dims: [384, 384, 384]
  point_flow_steps: 4
  point_flow_time_embed_dim: 96
  point_flow_dropout: 0.05
  point_flow_normal_hidden_dims: [192, 192]

loss_weights:
  # Primary training signal: per-point velocity MSE on linear interpolant
  # from Gaussian noise to clean. Weight is large because this is the
  # dominant gradient source for the decoder.
  point_flow_matching_loss: 5.0

  # Chamfer on the K-step Euler output. Weight is small (0.3) because
  # chamfer was the attractor that caused v0.7 collapse; here it acts as
  # a gentle consistency regulariser on top of the flow objective.
  recon_chamfer_loss: 0.3
  recon_normal_loss: 0.4

  # nearest_neighbor_l1_loss is DISABLED (weight 0): it assumes a
  # correspondence between recon[i] and corrupted[i] via the residual
  # skip connection. With flow matching, recon points come from random
  # noise and have no such correspondence.
  nearest_neighbor_l1_loss: 0.0

  # Reverse NN-L1 is a valid set-level coverage loss (clean -> recon)
  # and still works under the flow-matching regime.
  reverse_nearest_neighbor_l1_loss: 1.5

  # Visible / hidden chamfer act like recon_chamfer — soft regularisers.
  visible_recon_chamfer_loss: 0.5
  hidden_completion_chamfer_loss: 1.0

  # Auxiliary heads kept at roughly v0.7 weights so the encoder still
  # receives useful supervision (occupancy / symmetry / retrieval).
  point_defect_loss: 0.2
  corruption_score_loss: 0.05
  intrinsic_difficulty_loss: 0.1
  intrinsic_difficulty_pairwise_weight: 0.15
  intrinsic_difficulty_pairwise_margin: 0.05
  occupancy_bce_loss: 0.3
  free_space_violation_loss: 0.3
  vq_commitment_loss: 0.0
  prototype_diversity_loss: 0.0
  latent_align_loss: 0.01
  retrieval_align_loss: 0.03

  # The original latent flow (for stochastic hidden completion) stays on
  # at the same weight as v0.7 — it operates on a different latent,
  # independent of the point flow.
  latent_flow_matching_loss: 0.10
  symmetry_consistency_loss: 0.6
  hard_example_reweight: 0.5
  hard_weight_source: blend
  hard_weight_blend_alpha: 0.4
