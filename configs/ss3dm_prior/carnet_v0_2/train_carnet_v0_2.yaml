# CarNet_v0.2 training schedule.
#
# Changes vs v0.1 FULL (train_carnet_v0_1_full.yaml):
#   * epochs 45 -> 150 (user request)
#   * lr 4.0e-4 -> 3.0e-4  (slightly lower peak; a longer cosine spreads
#     high-LR phase over more epochs, and the expanded dataset means the
#     effective per-weight signal is larger per step)
#   * min_lr 2.0e-5 -> 1.0e-5 (floor halved since we have room to decay)
#   * occupancy_start_epoch 3 -> 0  (v0.1 occupancy head didn't produce
#     meaningful gradient until chamfer saturated ~epoch 30; let it run
#     from day 1 so 150 epochs of BCE gradient accumulate, not ~10)
#   * flow_matching_start_epoch 6 -> 4
#   * symmetry_start_epoch 4 -> 2 (rotation aug already active, symmetry
#     head benefits from earlier exposure)

train:
  seed: 0
  epochs: 150
  batch_size: 8
  grad_accum_steps: 1
  num_workers: 4
  lr: 3.0e-4
  min_lr: 1.0e-5
  lr_scheduler: cosine
  weight_decay: 0.001
  grad_clip_norm: 0.5
  amp: false
  ema:
    enable: true
    decay: 0.999
    use_for_eval: true
  log_interval: 20
  val_interval: 1
  save_interval: 5
  wandb_enable: true
  wandb_project: carnet_v0_2
  wandb_mode: online
  epoch_visualization_interval_epochs: 10
  max_visualization_examples: 2
  fixed_visualization_patch_ids: []
  step_visualization_interval_steps: 2000
  step_visualization_num_examples: 1
  step_visualization_patch_ids: []
  debug_use_all_patches_for_train_val: false
  allow_debug_split_override: false
  allow_split_fallback: false
  debug_val_fraction: 0.2
  curriculum:
    recon_warmup_epochs: 3
    warmup_epochs: 3
    main_start_epoch: 3
    occupancy_start_epoch: 0
    intrinsic_start_epoch: 4
    vq_start_epoch: 999
    prototype_start_epoch: 999
    flow_matching_start_epoch: 4
    symmetry_start_epoch: 2
    recon_chamfer_warmup_scale: 3.0
    recon_normal_warmup_scale: 2.0
    nearest_neighbor_warmup_scale: 4.0
  hard_example_sampling:
    enable: true
    alpha: 1.0
    floor: 1.0
    power: 1.0
  checkpoint_selection:
    best_composite_weights:
      val_denoise_gain_chamfer: 1.0
      val_recon_chamfer_l1: -1.0
      val_visible_recon_chamfer_l1: -0.5
      val_hidden_completion_chamfer_l1: -0.5
      val_occupancy_iou_visible: 0.4
      val_free_space_violation_rate: -0.4
      val_intrinsic_difficulty_spearman: 0.15
    best_visibility_weights:
      val_occupancy_iou_visible: 1.0
      val_free_space_violation_rate: -1.0
    best_paper_weights:
      val_denoise_gain_chamfer: 1.0
      val_recon_chamfer_l1: -1.0
      val_hidden_completion_chamfer_l1: -0.5
      val_occupancy_iou_visible: 0.4
      val_free_space_violation_rate: -0.4
      val_retrieval_top1_nonself: 0.15
