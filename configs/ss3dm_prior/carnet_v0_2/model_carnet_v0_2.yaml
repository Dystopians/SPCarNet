# CarNet_v0.2 — same architecture as v0.1 FULL. Decision: do not touch the
# network; v0.1's failure mode was diagnosed as schedule + loss-weight, not
# capacity. Any architectural exploration is postponed until v0.2 delivers
# a clean baseline on the expanded dataset.

dataset:
  subsets:
    - train
  seed: 0

corruptions:
  target_corrupted_count: 2048
  point_dropout: {enabled: true, dropout_ratio: 0.18}
  gaussian_jitter: {enabled: true, sigma: 0.04, anisotropic: true}
  normal_noise: {enabled: true, sigma: 0.08, flip_prob: 0.02}
  local_hole_mask: {enabled: true, max_holes: 2, hole_radius: 0.18}
  outlier_cluster: {enabled: true, cluster_size: 32, cluster_offset_sigma: 0.30, cluster_spread_sigma: 0.02}
  density_imbalance: {enabled: true, region_radius: 0.22, thin_probability: 0.5, thin_ratio: 0.50, duplicate_count: 48}

model:
  model_type: v11_latent_flow_hybrid
  latent_dim: 384
  retrieval_dim: 192
  recon_point_count: 2048
  use_observed_condition: true
  use_local_frame: true
  use_residual_reconstruction: true
  teacher_encoder_enabled: true
  occupancy_hidden_dim: 256
  use_vector_quantization: false
  num_latent_queries: 32
  num_cross_attention_layers: 3
  num_latent_self_attention_layers: 2
  attention_heads: 6
  ffn_dim: 768
  dropout: 0.10
  token_hidden_dims: [256, 384]
  decoder_hidden_dims: [768, 384]
  point_defect_hidden_dims: [384, 192]
  score_head_hidden_dims: [384, 192]
  intrinsic_head_hidden_dims: [384, 192]
  retrieval_head_hidden_dims: [384, 192]
  occupancy_hidden_dims: [256, 256, 256]
  latent_flow_hidden_dims: [768, 768]
  latent_flow_time_embed_dim: 96
  latent_flow_dropout: 0.05
  latent_flow_target: hidden_residual
  stochastic_eval_k_list: [1, 4, 8]
  stochastic_flow_steps: 8
  stochastic_free_space_safe_threshold: 0.10
  stochastic_rerank_weights:
    observed_consistency: 0.20
    visible_consistency: -0.35
    free_space_penalty: -0.30
    prototype_consistency: 0.15
  use_symmetry_head: true
  symmetry_head_hidden_dim: 192
  symmetry_head_dropout: 0.05
  use_retrieval_anchors: true
  num_retrieval_anchors: 3
  retrieval_anchor_dropout: 0.1

loss_weights:
  recon_chamfer_loss: 1.0
  recon_normal_loss: 0.5
  nearest_neighbor_l1_loss: 2.0
  reverse_nearest_neighbor_l1_loss: 2.0
  point_defect_loss: 0.3
  corruption_score_loss: 0.1
  intrinsic_difficulty_loss: 0.15
  intrinsic_difficulty_pairwise_weight: 0.25
  intrinsic_difficulty_pairwise_margin: 0.05
  # Boosted vs v0.1 (0.2 -> 0.35). In v0.1 the occupancy head was
  # gradient-dominated by chamfer for 30 epochs; raise its weight so it
  # gets real signal from day one.
  occupancy_bce_loss: 0.35
  free_space_violation_loss: 0.35
  # New in v0.2: explicit chamfer against hidden-only clean points.
  # v0.1's val_hidden_completion_chamfer_l1 plateaued at 0.167 because the
  # global recon_chamfer is dominated by visible points (~75% of clean).
  # This term targets the occluded side directly.
  hidden_completion_chamfer_loss: 0.5
  vq_commitment_loss: 0.0
  prototype_diversity_loss: 0.0
  latent_align_loss: 0.01
  retrieval_align_loss: 0.03
  latent_flow_matching_loss: 0.10
  symmetry_consistency_loss: 0.12
  hard_example_reweight: 0.5
  hard_weight_source: blend
  hard_weight_blend_alpha: 0.4
