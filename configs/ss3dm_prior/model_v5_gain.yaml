dataset:
  subsets:
    - train
  seed: 0

corruptions:
  target_corrupted_count: 2048
  point_dropout:
    enabled: true
    dropout_ratio: 0.18
  gaussian_jitter:
    enabled: true
    sigma: 0.035
    anisotropic: true
  normal_noise:
    enabled: true
    sigma: 0.12
    flip_prob: 0.05
  local_hole_mask:
    enabled: true
    max_holes: 2
    hole_radius: 0.28
  outlier_cluster:
    enabled: true
    cluster_size: 40
    cluster_offset_sigma: 0.55
    cluster_spread_sigma: 0.035
  density_imbalance:
    enabled: true
    region_radius: 0.32
    thin_probability: 0.5
    thin_ratio: 0.55
    duplicate_count: 72

model:
  latent_dim: 256
  retrieval_dim: 96
  recon_point_count: 2048
  use_observed_condition: true
  use_local_frame: true
  use_residual_reconstruction: true

loss_weights:
  recon_chamfer_loss: 1.0
  recon_normal_loss: 0.4
  point_defect_loss: 0.35
  patch_score_loss: 0.1
  latent_align_loss: 0.01
  retrieval_align_loss: 0.02
  hard_example_reweight: 0.6
