# CarNet_v0.3 training schedule — minimum-diff capacity probe.
#
# After the first v0.3 attempt stalled (train_gain plateaued at ~0.019 from
# epoch 14, visibility still 0 at epoch 20 vs v0.2's 0.586), diagnosis showed
# the combined changes — lower LR, longer warmup, heavier hidden-chamfer
# weight, delayed auxiliary-head gates — each individually small but jointly
# crushed early training dynamics. This revision reverts every training-side
# knob to v0.2 exactly and isolates the capacity bump (latent_dim 384->512,
# 5+3 attn layers, ffn 1536; see model_carnet_v0_3.yaml) as the sole change.
#
# Everything in this file is copied verbatim from train_carnet_v0_2.yaml
# except epochs (kept at 150) and wandb_project (now carnet_v0_2 umbrella).

train:
  seed: 0
  epochs: 150
  batch_size: 8
  grad_accum_steps: 1
  num_workers: 4
  lr: 3.0e-4
  min_lr: 1.0e-5
  lr_scheduler: cosine
  weight_decay: 0.001
  grad_clip_norm: 0.5
  amp: false
  ema:
    enable: true
    decay: 0.999
    use_for_eval: true
  log_interval: 20
  val_interval: 1
  save_interval: 5
  wandb_enable: true
  # Shared with v0.2 so runs stack in one workspace.
  wandb_project: carnet_v0_2
  wandb_mode: online
  epoch_visualization_interval_epochs: 10
  max_visualization_examples: 2
  fixed_visualization_patch_ids: []
  step_visualization_interval_steps: 2000
  step_visualization_num_examples: 1
  step_visualization_patch_ids: []
  debug_use_all_patches_for_train_val: false
  allow_debug_split_override: false
  allow_split_fallback: false
  debug_val_fraction: 0.2
  curriculum:
    recon_warmup_epochs: 3
    warmup_epochs: 3
    main_start_epoch: 3
    occupancy_start_epoch: 0
    intrinsic_start_epoch: 4
    vq_start_epoch: 999
    prototype_start_epoch: 999
    flow_matching_start_epoch: 4
    symmetry_start_epoch: 2
    recon_chamfer_warmup_scale: 3.0
    recon_normal_warmup_scale: 2.0
    nearest_neighbor_warmup_scale: 4.0
  hard_example_sampling:
    enable: true
    alpha: 1.0
    floor: 1.0
    power: 1.0
  checkpoint_selection:
    best_composite_weights:
      val_denoise_gain_chamfer: 1.0
      val_recon_chamfer_l1: -1.0
      val_visible_recon_chamfer_l1: -0.5
      val_hidden_completion_chamfer_l1: -0.5
      val_occupancy_iou_visible: 0.4
      val_free_space_violation_rate: -0.4
      val_intrinsic_difficulty_spearman: 0.15
    best_visibility_weights:
      val_occupancy_iou_visible: 1.0
      val_free_space_violation_rate: -1.0
    best_paper_weights:
      val_denoise_gain_chamfer: 1.0
      val_recon_chamfer_l1: -1.0
      val_hidden_completion_chamfer_l1: -0.5
      val_occupancy_iou_visible: 0.4
      val_free_space_violation_rate: -0.4
      val_retrieval_top1_nonself: 0.15
