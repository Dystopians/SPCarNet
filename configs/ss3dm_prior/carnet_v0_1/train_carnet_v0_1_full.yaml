# CarNet_v0.1 FULL training config.
#
# Key changes vs v0:
#   amp: true -> false (no more GradScaler collapse).
#   lr: 0.0002 -> 0.00015 (conservative under fp32).
#   grad_clip_norm: 1.0 -> 0.5 (tighter — multi-head optimisation is spiky).
#   epochs: 60 -> 45 (with stable training we expect faster convergence).
#   recon_warmup_epochs: 2 -> 5 (give geometry a real chance to settle).
#   Warmup-scale multipliers on chamfer/normal/nn so the recon head
#   genuinely dominates the first 5 epochs.

train:
  seed: 0
  epochs: 45
  batch_size: 8
  grad_accum_steps: 1
  num_workers: 4
  lr: 0.0004
  min_lr: 0.00002
  lr_scheduler: cosine
  weight_decay: 0.001
  grad_clip_norm: 0.5
  amp: false
  ema:
    enable: true
    decay: 0.999
    use_for_eval: true
  log_interval: 20
  val_interval: 1
  save_interval: 2
  wandb_enable: true
  wandb_project: carnet_v0_1
  wandb_mode: online
  epoch_visualization_interval_epochs: 5
  max_visualization_examples: 2
  fixed_visualization_patch_ids: []
  step_visualization_interval_steps: 1000
  step_visualization_num_examples: 1
  step_visualization_patch_ids: []
  debug_use_all_patches_for_train_val: false
  allow_debug_split_override: false
  allow_split_fallback: false
  debug_val_fraction: 0.2
  curriculum:
    recon_warmup_epochs: 3
    warmup_epochs: 3
    main_start_epoch: 3
    occupancy_start_epoch: 3
    intrinsic_start_epoch: 6
    vq_start_epoch: 999          # VQ disabled
    prototype_start_epoch: 999   # prototype diversity disabled
    flow_matching_start_epoch: 6
    symmetry_start_epoch: 4
    # During warmup triple the chamfer weight and 2x the other recon terms
    # so the residual head is forced to actually denoise, not pass-through.
    recon_chamfer_warmup_scale: 3.0
    recon_normal_warmup_scale: 2.0
    nearest_neighbor_warmup_scale: 4.0
  hard_example_sampling:
    enable: true
    alpha: 1.0
    floor: 1.0
    power: 1.0
  checkpoint_selection:
    best_composite_weights:
      val_denoise_gain_chamfer: 1.0
      val_recon_chamfer_l1: -1.0
      val_visible_recon_chamfer_l1: -0.5
      val_hidden_completion_chamfer_l1: -0.5
      val_occupancy_iou_visible: 0.4
      val_free_space_violation_rate: -0.4
      val_intrinsic_difficulty_spearman: 0.15
    best_visibility_weights:
      val_occupancy_iou_visible: 1.0
      val_free_space_violation_rate: -1.0
    best_paper_weights:
      val_denoise_gain_chamfer: 1.0
      val_recon_chamfer_l1: -1.0
      val_hidden_completion_chamfer_l1: -0.5
      val_occupancy_iou_visible: 0.4
      val_free_space_violation_rate: -0.4
      val_retrieval_top1_nonself: 0.15
