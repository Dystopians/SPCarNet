<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fafbfc"/>
      <stop offset="1" stop-color="#eef2f6"/>
    </linearGradient>
    <linearGradient id="csefBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3f0ff"/>
      <stop offset="1" stop-color="#c5dcff"/>
    </linearGradient>
    <linearGradient id="defectBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3d6"/>
      <stop offset="1" stop-color="#ffe1a1"/>
    </linearGradient>
    <linearGradient id="editBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e1f7e6"/>
      <stop offset="1" stop-color="#b8ecc4"/>
    </linearGradient>
    <linearGradient id="gateBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde2e6"/>
      <stop offset="1" stop-color="#f7b8c1"/>
    </linearGradient>
    <linearGradient id="ioBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f0f3"/>
      <stop offset="1" stop-color="#d8d8e0"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#34495e"/>
    </marker>
    <marker id="arrRollback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b03a48"/>
    </marker>
  </defs>

  <rect width="1280" height="460" fill="url(#bgFade)"/>

  <!-- Title -->
  <text x="640" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2d3d">MeshSplatOpt</text>
  <text x="640" y="58" text-anchor="middle" font-size="13" fill="#3e5060">Evidence-Certified Bidirectional Mesh Surgery for Mesh Splatting</text>

  <!-- Input -->
  <g>
    <rect x="30" y="160" width="150" height="120" rx="10" fill="url(#ioBox)" stroke="#5d6b7b" stroke-width="1.2"/>
    <text x="105" y="185" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2d3d">Mesh Splatting</text>
    <text x="105" y="203" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2d3d">Checkpoint</text>
    <text x="105" y="226" text-anchor="middle" font-size="11" fill="#506174">triangle soup</text>
    <text x="105" y="242" text-anchor="middle" font-size="11" fill="#506174">+ posed images</text>
    <text x="105" y="258" text-anchor="middle" font-size="11" fill="#506174">+ COLMAP sparse</text>
  </g>

  <!-- CSEF -->
  <g>
    <rect x="210" y="120" width="220" height="200" rx="10" fill="url(#csefBox)" stroke="#345d96" stroke-width="1.2"/>
    <text x="320" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#13325c">Counterfactual Surface</text>
    <text x="320" y="164" text-anchor="middle" font-size="14" font-weight="700" fill="#13325c">Evidence Field (CSEF)</text>
    <line x1="232" y1="178" x2="408" y2="178" stroke="#7997c1" stroke-width="0.8"/>
    <text x="232" y="200" font-size="11.5" fill="#1f3a63">+ positive surface evidence</text>
    <text x="232" y="218" font-size="11.5" fill="#1f3a63">− negative free-space evidence</text>
    <text x="232" y="236" font-size="11.5" fill="#1f3a63">⚠ explanation debt</text>
    <text x="232" y="254" font-size="11.5" fill="#1f3a63">▸ prior support</text>
    <text x="232" y="272" font-size="11.5" fill="#1f3a63">⊟ topology cost</text>
    <text x="232" y="290" font-size="11.5" fill="#1f3a63">~ uncertainty</text>
    <text x="320" y="310" text-anchor="middle" font-size="10" fill="#3e5d8a" font-style="italic">per face / vertex / region</text>
  </g>

  <!-- Defect mining -->
  <g>
    <rect x="460" y="140" width="200" height="160" rx="10" fill="url(#defectBox)" stroke="#a47e2a" stroke-width="1.2"/>
    <text x="560" y="165" text-anchor="middle" font-size="14" font-weight="700" fill="#5c4313">Defect Mining</text>
    <line x1="480" y1="178" x2="640" y2="178" stroke="#caa757" stroke-width="0.8"/>
    <text x="480" y="200" font-size="11.5" fill="#553f15">floater component</text>
    <text x="480" y="216" font-size="11.5" fill="#553f15">local dent</text>
    <text x="480" y="232" font-size="11.5" fill="#553f15">rough / broken surface</text>
    <text x="480" y="248" font-size="11.5" fill="#553f15">ground-wall misalignment</text>
    <text x="480" y="264" font-size="11.5" fill="#553f15">small boundary hole</text>
    <text x="480" y="280" font-size="11.5" fill="#553f15">giant ground void</text>
    <text x="560" y="296" text-anchor="middle" font-size="10" fill="#7a5a1f" font-style="italic">vs. unknown unobserved void</text>
  </g>

  <!-- Reversible edit calculus -->
  <g>
    <rect x="690" y="120" width="240" height="200" rx="10" fill="url(#editBox)" stroke="#2f7a44" stroke-width="1.2"/>
    <text x="810" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#163d22">Reversible Edit Calculus</text>
    <line x1="712" y1="160" x2="908" y2="160" stroke="#69af80" stroke-width="0.8"/>
    <g font-size="11.5" fill="#1c4729">
      <rect x="710" y="172" width="100" height="22" rx="5" fill="#ffffff" stroke="#5fa274"/>
      <text x="760" y="187" text-anchor="middle">protect</text>
      <rect x="816" y="172" width="100" height="22" rx="5" fill="#ffffff" stroke="#5fa274"/>
      <text x="866" y="187" text-anchor="middle">delete</text>
      <rect x="710" y="200" width="100" height="22" rx="5" fill="#ffffff" stroke="#5fa274"/>
      <text x="760" y="215" text-anchor="middle">collapse</text>
      <rect x="816" y="200" width="100" height="22" rx="5" fill="#ffffff" stroke="#5fa274"/>
      <text x="866" y="215" text-anchor="middle">snap / deform</text>
      <rect x="710" y="228" width="100" height="22" rx="5" fill="#ffffff" stroke="#5fa274"/>
      <text x="760" y="243" text-anchor="middle">split</text>
      <rect x="816" y="228" width="100" height="22" rx="5" fill="#ffffff" stroke="#5fa274"/>
      <text x="866" y="243" text-anchor="middle">fill / patch</text>
      <rect x="710" y="256" width="206" height="22" rx="5" fill="#ffffff" stroke="#5fa274"/>
      <text x="813" y="271" text-anchor="middle">appearance reset / recovery</text>
    </g>
    <text x="810" y="304" text-anchor="middle" font-size="10" fill="#2f5a3b" font-style="italic">snapshot → apply → verify → keep | rollback</text>
  </g>

  <!-- Counterfactual gates -->
  <g>
    <rect x="960" y="120" width="220" height="200" rx="10" fill="url(#gateBox)" stroke="#993d4d" stroke-width="1.2"/>
    <text x="1070" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#511a26">Counterfactual</text>
    <text x="1070" y="164" text-anchor="middle" font-size="14" font-weight="700" fill="#511a26">Certificates</text>
    <line x1="982" y1="178" x2="1158" y2="178" stroke="#c2697a" stroke-width="0.8"/>
    <text x="982" y="200" font-size="11.5" fill="#502130">render gate (PSNR / LPIPS)</text>
    <text x="982" y="218" font-size="11.5" fill="#502130">sparse-depth gate (AbsRel)</text>
    <text x="982" y="236" font-size="11.5" fill="#502130">normal proxy gate</text>
    <text x="982" y="254" font-size="11.5" fill="#502130">free-space violation</text>
    <text x="982" y="272" font-size="11.5" fill="#502130">topology integrity</text>
    <text x="982" y="290" font-size="11.5" fill="#502130">changed-pixel ratio</text>
    <text x="1070" y="310" text-anchor="middle" font-size="10" fill="#7d3140" font-style="italic">all gates pass → commit</text>
  </g>

  <!-- Output: placed under the certificates so the commit arrow is a clean vertical -->
  <g>
    <rect x="965" y="370" width="210" height="74" rx="10" fill="#ffffff" stroke="#1f2d3d" stroke-width="1.4"/>
    <text x="1070" y="395" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Repaired Mesh</text>
    <text x="1070" y="414" text-anchor="middle" font-size="11" fill="#3e5060">+ teacher-guided recovery</text>
    <text x="1070" y="430" text-anchor="middle" font-size="11" fill="#3e5060">+ topology-retention schedule</text>
  </g>

  <!-- Arrows: forward chain -->
  <g stroke="#34495e" stroke-width="1.6" fill="none">
    <line x1="180" y1="220" x2="208" y2="220" marker-end="url(#arr)"/>
    <line x1="430" y1="220" x2="458" y2="220" marker-end="url(#arr)"/>
    <line x1="660" y1="220" x2="688" y2="220" marker-end="url(#arr)"/>
    <line x1="930" y1="220" x2="958" y2="220" marker-end="url(#arr)"/>
  </g>

  <!-- Commit arrow: vertical from certificates to repaired mesh -->
  <g stroke="#2f7a44" stroke-width="1.8" fill="none">
    <line x1="1070" y1="320" x2="1070" y2="368" marker-end="url(#arr)"/>
  </g>
  <text x="1080" y="350" font-size="11" fill="#2f7a44" font-weight="600">commit</text>

  <!-- Rollback loop arrow: U-shape entirely under all boxes back into CSEF bottom -->
  <g stroke="#b03a48" stroke-width="1.6" fill="none" stroke-dasharray="6,4">
    <path d="M 962 322 C 700 420, 270 420, 220 322" marker-end="url(#arrRollback)"/>
  </g>
  <text x="500" y="412" font-size="11" fill="#b03a48" font-weight="600">rollback (any gate fails)</text>
</svg>
